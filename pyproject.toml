[project]
name = "gemma-lab"
version = "0.1.0"
description = "Distil the Gemini Decisions API into a local Gemma for sensitive data: fake scenarios, Gemini labels, LoRA on Modal"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.6",
  "transformers>=5.10",
  "accelerate>=1.0",
  "peft>=0.17",
  "sentence-transformers>=5.1",
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "modal>=1.1",
  "soundfile>=0.14.0",
  "soxr>=1.1.0",
]

[tool.uv]
package = false
